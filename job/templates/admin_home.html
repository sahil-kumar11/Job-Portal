{% extends "admin_navigation.html" %}
{% block body %}

<style>

.dashboard{
    width: 90%;
    margin: auto;
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card{
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover{
    transform: scale(1.05);
}

.card h2{
    font-size: 30px;
    color: #8e0e00;
}

.card p{
    font-size: 18px;
}

</style>

<h1 style="text-align:center; margin-top:30px;">
    Admin Dashboard
</h1>

<div class="dashboard">

    <div class="card">
        <h2>Users</h2>
        <p>Manage all registered users</p>
    </div>

    <div class="card">
        <h2>Recruiters</h2>
        <p>Approve / Reject recruiters</p>
    </div>

    <div class="card">
        <h2>Jobs</h2>
        <p>View all posted jobs</p>
    </div>

</div>

{% endblock %}

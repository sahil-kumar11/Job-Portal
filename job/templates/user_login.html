{% extends "navigation.html" %}
{% load static %}
{% block body %}

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} text-center">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}



<style>

    body{
        background-color: #f5f7fa;
    }

    .login-container{
        width: 40%;
        background-color: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0px 0px 25px rgba(0,0,0,0.2);
    }

    .login-title{
        font-family: Monotype Corsiva;
        color: #6a11cb;
        font-size: 42px;
        font-weight: bold;
    }

    .form-label{
        font-weight: bold;
        font-size: 18px;
        color: #333;
    }

    .form-control{
        height: 48px;
        border-radius: 12px;
        border: 1px solid #ccc;
    }

    .form-control:focus{
        box-shadow: 0px 0px 8px #6a11cb;
        border-color: #6a11cb;
    }

    .submit-btn{
        background: linear-gradient(to right, #6a11cb, #2575fc);
        color: white;
        font-size: 18px;
        font-weight: bold;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 12px;
        transition: 0.3s;
    }

    .submit-btn:hover{
        transform: scale(1.03);
        background: linear-gradient(to right, #ff512f, #dd2476);
    }

    .extra-links{
        text-align: center;
        margin-top: 15px;
    }

    .extra-links a{
        text-decoration: none;
        font-weight: bold;
        color: #2575fc;
    }

    .extra-links a:hover{
        color: red;
    }

</style>

<!-- Marquee -->

<marquee style="
    font-family: Monotype Corsiva;
    font-size: 30px;
    color: white;
    background: linear-gradient(to right, #6a11cb, #2575fc);
    font-weight: bold;
    margin-top: 1%;
    padding: 10px;
">

    User Login Form

</marquee>

<!-- Login Form -->

<div class="container mt-5">

    <div class="login-container mx-auto">

        <h2 class="text-center login-title mb-4">
            User Login
        </h2>

        <form method="post">

            {% csrf_token %}

            

        <div class="form-group">

            <label class="form-label">
             Username
            </label>

            <input type="text"
            name="username"
            class="form-control"
            placeholder="Enter Your Username">

        </div>
            <!-- Password -->

            <div class="form-group">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                name="password"
                class="form-control"
                placeholder="Enter Your Password">

            </div>

            <!-- Login Button -->

            <button type="submit" class="submit-btn mt-3">

                Login

            </button>

            <!-- Extra Links -->

            <div class="extra-links">

                <p class="mt-3">
                    Don't have an account?
                    <a href="{% url 'user_signup' %}">Register Here</a>
                </p>

            </div>

        </form>

    </div>

</div>

{% endblock %}

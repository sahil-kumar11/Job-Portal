{% extends "admin_navigation.html" %}
{% block body %}

{% if error == "no" %}
<script>
    alert("Password Changed Successfully");
    window.location = "{% url 'admin_login' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Old Password Incorrect");
</script>
{% endif %}

<style>

body{
    background: #f4f7fa;
}

/* CARD */
.password-box{
    width: 40%;
    margin: auto;
    margin-top: 60px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
    animation: fadeIn 0.7s ease-in-out;
}

/* TITLE */
.title{
    text-align: center;
    font-size: 38px;
    font-family: Monotype Corsiva;
    color: #2575fc;
    margin-bottom: 25px;
}

/* INPUT */
.form-control{
    height: 48px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.form-control:focus{
    border-color: #2575fc;
    box-shadow: 0 0 10px rgba(37,117,252,0.4);
    transform: scale(1.02);
}

/* BUTTON */
.btn-change{
    width: 100%;
    padding: 12px;
    background: linear-gradient(to right, #2575fc, #6a11cb);
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    transition: 0.3s;
}

.btn-change:hover{
    background: linear-gradient(to right, #ff512f, #dd2476);
    transform: scale(1.03);
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

<div class="password-box">

    <div class="title">Admin Change Password</div>

    <form method="post">
        {% csrf_token %}

        <input type="password" name="old_password" class="form-control" placeholder="Old Password">

        <input type="password" name="new_password" class="form-control" placeholder="New Password">

        <button type="submit" class="btn-change">
            Change Password
        </button>

    </form>

</div>

{% endblock %}

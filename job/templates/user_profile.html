{% extends "user_navigation.html" %}
{% load static %}

{% block body %}

{% if success %}
<script>
    alert("{{ success }}");
    window.location = "{% url 'user_home' %}";
</script>
{% endif %}

{% if error %}
<script>
    alert("{{ error }}");
</script>
{% endif %}

<style>

body{
    background: #f4f7fc;
}

.profile-box{
    width: 50%;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0px 5px 25px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.profile-box:hover{
    transform: translateY(-5px);
}

.profile-title{
    text-align: center;
    font-size: 40px;
    font-family: Monotype Corsiva;
    color: #2575fc;
    margin-bottom: 25px;
}

.profile-icon{
    text-align: center;
    font-size: 60px;
    color: #6a11cb;
    margin-bottom: 10px;
}

.form-control{
    height: 50px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.form-control:focus{
    border-color: #2575fc;
    box-shadow: 0 0 10px rgba(37,117,252,0.3);
    transform: scale(1.02);
}

.btn-update{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(to right,#2575fc,#6a11cb);
    color: white;
    font-weight: bold;
    font-size: 18px;
    transition: 0.3s;
}

.btn-update:hover{
    background: linear-gradient(to right,#ff512f,#dd2476);
    transform: scale(1.05);
}

.label-text{
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
    color: #333;
}

.info-note{
    background: #e8f0fe;
    padding: 10px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 13px;
    color: #555;
    text-align: center;
}

</style>

<div class="profile-box">

    <div class="profile-icon">
        👤
    </div>

    <h2 class="profile-title">
        My Profile
    </h2>

    <form method="post" onsubmit="return validateForm()">
        {% csrf_token %}

        <label class="label-text">Username</label>
        <input type="text"
               class="form-control"
               name="username"
               id="username"
               value="{{ request.user.username }}"
               required>

        <label class="label-text">Email</label>
        <input type="email"
               class="form-control"
               name="email"
               id="email"
               value="{{ request.user.email }}"
               required>

        <button type="submit" class="btn-update">
            Update Profile
        </button>

        <div class="info-note">
            <i class="fa fa-info-circle"></i> 
            Note: After updating, you'll be redirected to home page
        </div>

    </form>

</div>

<script>
function validateForm() {
    var username = document.getElementById('username').value.trim();
    var email = document.getElementById('email').value.trim();
    
    if(username == "") {
        alert("Username cannot be empty!");
        return false;
    }
    
    if(email == "") {
        alert("Email cannot be empty!");
        return false;
    }
    
    // Basic email validation
    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailPattern.test(email)) {
        alert("Please enter a valid email address!");
        return false;
    }
    
    return true;
}
</script>

{% endblock %}

{% extends "admin_navigation.html" %}
{% load static %}

{% block body %}

<style>

.table-box{
    width: 95%;
    margin: auto;
    margin-top: 40px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
}

.title{
    text-align: center;
    font-size: 38px;
    font-family: Monotype Corsiva;
    color: #dc3545;
    margin-bottom: 20px;
}

.table th{
    background: linear-gradient(to right, #dc3545, #6c1a1a);
    color: white;
    text-align: center;
}

.table td{
    text-align: center;
    vertical-align: middle;
}

.table tr:hover{
    background: #f8f9fa;
    transition: 0.3s;
}

.badge-rejected{
    padding: 5px 10px;
    background: #dc3545;
    color: white;
    border-radius: 8px;
}

.info-text{
    color: gray;
    font-style: italic;
}

</style>

<div class="table-box">

    <div class="title">
        Rejected Recruiters
    </div>

    <table class="table table-bordered table-hover">

        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Company</th>
                <th>Type</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

            {% for i in data %}

            <tr>
                <td>{{ i.id }}</td>
                <td>{{ i.user.username }}</td>
                <td>{{ i.user.email }}</td>
                <td>{{ i.company }}</td>
                <td>{{ i.type }}</td>

                <td>
                    <span class="badge-rejected">
                        {{ i.status }}
                    </span>
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}

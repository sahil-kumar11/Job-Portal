{% extends "user_navigation.html" %}
{% load static %}

{% block body %}

{% if error == "no" %}
<script>
    alert("Password Changed Successfully");
    window.location = "{% url 'user_login' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Old Password Incorrect");
</script>
{% endif %}

<style>

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
}

.password-box{
    width: 40%;
    margin: 60px auto;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
    animation: slideDown 0.8s ease;
}

.title{
    text-align: center;
    font-family: Monotype Corsiva;
    font-size: 42px;
    color: #764ba2;
    margin-bottom: 25px;
}

.form-control{
    height: 50px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.form-control:focus{
    border-color: #764ba2;
    box-shadow: 0 0 12px rgba(118,75,162,0.4);
    transform: scale(1.02);
}

.change-btn{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(to right,#667eea,#764ba2);
    transition: 0.3s;
}

.change-btn:hover{
    transform: scale(1.04);
    background: linear-gradient(to right,#ff512f,#dd2476);
}

.icon{
    text-align: center;
    font-size: 60px;
    color: #764ba2;
    margin-bottom: 10px;
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

<div class="container">

    <div class="password-box">

        <div class="icon">
            🔐
        </div>

        <h2 class="title">
            Change Password
        </h2>

        <form method="post">

            {% csrf_token %}

            <input type="password"
                   name="old_password"
                   class="form-control"
                   placeholder="Enter Old Password">

            <input type="password"
                   name="new_password"
                   class="form-control"
                   placeholder="Enter New Password">

            <button type="submit" class="change-btn">
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}

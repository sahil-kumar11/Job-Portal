{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Recruiter Panel</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        body{
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar{
            background: linear-gradient(to right, #141e30, #243b55);
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .navbar-brand{
            font-family: Monotype Corsiva;
            font-size: 30px;
            color: #fff !important;
        }

        .nav-link{
            color: white !important;
            margin-right: 10px;
            transition: 0.3s;
            border-radius: 6px;
            padding: 6px 10px;
        }

        .nav-link:hover{
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-sm navbar-dark">

    <a class="navbar-brand" href="#">
        Recruiter Panel
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">

        <ul class="navbar-nav ml-auto">

            <!-- HOME -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'recruiter_home' %}">
                    <i class="fa fa-home"></i> Home
                </a>
            </li>

            <!-- ADD JOB -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'add_job' %}">
                    <i class="fa fa-plus-circle"></i> Add Job
                </a>
            </li>

            <!-- JOB LIST -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'recruiter_job_list' %}">
                    <i class="fa fa-list"></i> Job List
                </a>
            </li>

            <!-- APPLIED CANDIDATES -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'applied_candidates' %}">
                    <i class="fa fa-users"></i> Candidates Applied
                </a>
            </li>

            <!-- CHANGE PASSWORD -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'recruiter_change_password' %}">
                    <i class="fa fa-key"></i> Change Password
                </a>
            </li>

            <!-- LOGOUT -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'recruiter_logout' %}">
                    <i class="fa fa-sign-out"></i> Logout
                </a>
            </li>

        </ul>

    </div>

</nav>

<!-- CONTENT -->
{% block body %}
{% endblock %}

</body>
</html>

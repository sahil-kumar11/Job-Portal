{% extends "navigation.html" %}
{% load static %}
{% block body %}

{% if error == "no" %}
<script>
    alert("Login Successful");
    window.location = "{% url 'recruiter_home' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Invalid Login Credentials");
</script>
{% endif %}

<style>

    body{
        background-color: #eef2f7;
    }

    .recruiter-container{
        width: 45%;
        background-color: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0px 0px 25px rgba(0,0,0,0.2);
    }

    .recruiter-title{
        font-family: Monotype Corsiva;
        font-size: 42px;
        font-weight: bold;
        color: #ff512f;
    }

    .form-label{
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }

    .form-control{
        height: 48px;
        border-radius: 12px;
        border: 1px solid #bbb;
    }

    .form-control:focus{
        border-color: #ff512f;
        box-shadow: 0px 0px 8px #ff512f;
    }

    .submit-btn{
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: linear-gradient(to right, #ff512f, #dd2476);
        transition: 0.3s;
    }

    .submit-btn:hover{
        transform: scale(1.03);
        background: linear-gradient(to right, #11998e, #38ef7d);
    }

    .bottom-text{
        text-align: center;
        margin-top: 15px;
    }

    .bottom-text a{
        text-decoration: none;
        font-weight: bold;
        color: #dd2476;
    }

    .bottom-text a:hover{
        color: #11998e;
    }

</style>

<!-- Marquee -->

<marquee style="
    font-family: Monotype Corsiva;
    font-size: 30px;
    color: white;
    background: linear-gradient(to right, #ff512f, #dd2476);
    font-weight: bold;
    margin-top: 1%;
    padding: 10px;
">

    Recruiter Login Form

</marquee>

<!-- Recruiter Login Form -->

<div class="container mt-5">

    <div class="recruiter-container mx-auto">

        <h2 class="text-center recruiter-title mb-4">
            Recruiter Login
        </h2>

        <form method="post">

            {% csrf_token %}

            <!-- Company Email -->

            <div class="form-group">

                <label class="form-label">
                    UserName
                </label>

                <input type="text"
name="username"
class="form-control"
placeholder="Enter Username">

            </div>

            <!-- Password -->

            <div class="form-group">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password">

            </div>

            <!-- Login Button -->

            <button type="submit" class="submit-btn mt-3">

                Recruiter Login

            </button>

            <!-- Bottom Text -->

            <div class="bottom-text">

                <p class="mt-3">
                    New Recruiter?
                    <a href="{% url 'recruiter_signup' %}">Create Account</a>
                </p>

            </div>

        </form>

    </div>

</div>

{% endblock %}

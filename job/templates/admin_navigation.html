<!DOCTYPE html>
<html>
<head>

    {% load static %}

    <title>Job Portal - Admin</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        body{
            font-family: Arial;
            background: #f4f6f9;
        }

        /* HEADER */
        .header-box{
            background: white;
            padding: 12px 0;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.1);
        }

        /* BRAND */
        .navbar-brand{
            font-size: 28px;
            font-family: Monotype Corsiva;
            transition: 0.3s;
        }

        .navbar-brand:hover{
            transform: scale(1.05);
            color: #ffdd57 !important;
        }

        /* NAV LINKS */
        .nav-link{
            color: white !important;
            margin-right: 10px;
            padding: 6px 14px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .nav-link:hover{
            background: rgba(255,255,255,0.15);
            color: #ffdd57 !important;
            transform: translateY(-2px);
        }

        /* SOCIAL ICONS */
        .social-icon i{
            font-size: 22px;
            margin-right: 10px;
            color: #333;
            transition: 0.3s;
        }

        .social-icon i:hover{
            color: #ff4b2b;
            transform: scale(1.3);
        }

        /* NAVBAR */
        .navbar{
            box-shadow: 0px 4px 10px rgba(0,0,0,0.25);
        }

        /* ACTIVE STYLE OPTIONAL */
        .nav-item .active{
            background: rgba(255,255,255,0.2);
        }

    </style>

</head>

<body>

<!-- HEADER -->
<div class="container header-box mt-2 mb-2">

    <div class="row align-items-center">

        <div class="col-md-3 text-center">
            <img src="{% static 'images/job1.jpg' %}"
            style="width:150px; height:130px; border-radius:10px;">
        </div>

        <div class="col-md-6 text-center">

            <h3 style="font-weight:bold; margin:0;">
                <span style="color:#ff4b2b;">Online Job</span>
                <span style="color:#28a745;">Portal System</span>
            </h3>

            <small style="color:gray;">Admin Dashboard Panel</small>

        </div>

        <div class="col-md-3 text-center social-icon">

            <i class="fa fa-facebook"></i>
            <i class="fa fa-twitter"></i>
            <i class="fa fa-linkedin"></i>
            <i class="fa fa-instagram"></i>

        </div>

    </div>

</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-sm navbar-dark"
style="background: linear-gradient(to right, #8e0e00, #1f1c18);">

    <a class="navbar-brand text-white pl-3" href="{% url 'admin_home' %}">
        Job Portal
    </a>

    <button class="navbar-toggler" type="button"
    data-toggle="collapse"
    data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ml-auto">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'admin_home' %}">
                    <i class="fa fa-home mr-1"></i>Home
                </a>
            </li>

            <li class="nav-item dropdown">

    <a class="nav-link dropdown-toggle" href="#" id="recruiterDropdown"
       role="button" data-toggle="dropdown">

        <i class="fa fa-briefcase mr-1"></i> Recruiters
    </a>

    <div class="dropdown-menu">

        <a class="dropdown-item" href="{% url 'recruiter_list_all' %}">
            All Recruiters
        </a>

        <a class="dropdown-item" href="{% url 'recruiter_list_pending' %}">
            Pending
        </a>

        <a class="dropdown-item" href="{% url 'recruiter_list_accepted' %}">
            Accepted
        </a>

        <a class="dropdown-item" href="{% url 'recruiter_list_rejected' %}">
            Rejected
        </a>

    </div>

</li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'view_users' %}">
                    <i class="fa fa-user mr-1"></i>View Users
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'admin_change_password' %}">
                    <i class="fa fa-key mr-1"></i>Change Password
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'user_logout' %}">
                    <i class="fa fa-sign-out mr-1"></i>Logout
                </a>
            </li>

        </ul>

    </div>

</nav>

<!-- CONTENT -->
{% block body %}
{% endblock %}

<!-- FOOTER -->
{% include "footer.html" %}

</body>
</html>

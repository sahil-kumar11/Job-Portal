<!DOCTYPE html>
<html>
<head>

    {% load static %}

    <title>Job Portal</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-wrapper {
            flex: 1;
        }

        .nav-link{
            color: white !important;
            margin-right: 10px;
            transition: 0.3s;
        }

        .nav-link:hover{
            color: yellow !important;
            font-weight: bold;
            background-color: red;
            border-radius: 10px;
        }

        .navbar-brand:hover{
            color: yellow !important;
        }

        .social-icon i{
            font-size: 28px;
            margin-right: 10px;
            color: black;
            transition: 0.3s;
        }

        .social-icon i:hover{
            color: red;
            transform: scale(1.2);
        }

    </style>

</head>

<body>

    <!-- Header Section -->

    <div class="container">

        <div class="row align-items-center">

            <!-- Logo -->

            <div class="col-md-3 text-center">
                <img src="{% static 'images/job1.jpg' %}"
                style="width:180px; height:150px;">
            </div>

            <!-- Website Name -->

            <div class="col-md-6 text-center">

                <span style="font-weight:bold; font-size:35px;">

                    <span style="color:red;">Online Job</span>

                    <span style="color:green;">Portal System</span>

                </span>

            </div>

            <!-- Social Icons -->

            <div class="col-md-3 text-center social-icon">

                <i class="fa fa-twitter"></i>
                <i class="fa fa-facebook"></i>
                <i class="fa fa-linkedin"></i>
                <i class="fa fa-instagram"></i>

            </div>

        </div>

    </div>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-sm navbar-dark"
    style="background-color:maroon;">

        <a class="navbar-brand font-weight-bold pl-4"
        style="font-family:'Monotype Corsiva'; font-size:32px;"
        href="#">

            Job Portal

        </a>

        <!-- Mobile Toggle Button -->

        <button class="navbar-toggler" type="button"
        data-toggle="collapse"
        data-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar Links -->

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">
                        <i class="fa fa-home mr-1"></i>Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'latest_jobs' %}">
                        <i class="fa fa-briefcase mr-1"></i>Latest Jobs
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_login' %}">
                        <i class="fa fa-user mr-1"></i>User Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'recruiter_login' %}">
                        <i class="fa fa-user-plus mr-1"></i>Recruiter Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin_login' %}">
                        <i class="fa fa-lock mr-1"></i>Admin Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">
                        <i class="fa fa-phone mr-1"></i>Contact
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Page content wrapper -->
    <div class="content-wrapper">
        {% block body %}
        {% endblock %}
    </div>

    <!-- Footer - YAHAN AAYEGA (body ke end mein, content ke baad) -->
    {% include "footer.html" %}

</body>
</html>

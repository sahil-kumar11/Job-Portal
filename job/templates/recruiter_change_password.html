{% extends "recruiter_navigation.html" %}
{% block body %}

{% if error == "no" %}
<script>
    alert("Password Changed Successfully");
    window.location = "{% url 'recruiter_login' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Old Password Incorrect");
</script>
{% endif %}

<style>

body{
    background: #f4f7fc;
}

/* CARD */
.password-box{
    width: 40%;
    margin: auto;
    margin-top: 60px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
    animation: fadeIn 0.7s ease-in-out;
}

/* TITLE */
.password-box h2{
    text-align: center;
    font-family: Monotype Corsiva;
    font-size: 38px;
    color: #ff512f;
    margin-bottom: 25px;
}

/* INPUT */
.form-control{
    height: 48px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.form-control:focus{
    border-color: #ff512f;
    box-shadow: 0px 0px 8px rgba(255,81,47,0.4);
    transform: scale(1.02);
}

/* BUTTON */
.btn-change{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    color: white;
    background: linear-gradient(to right, #ff512f, #dd2476);
    transition: 0.3s;
}

.btn-change:hover{
    transform: scale(1.05);
    background: linear-gradient(to right, #11998e, #38ef7d);
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

<div class="password-box">

    <h2>Recruiter Change Password</h2>

    <form method="post">
        {% csrf_token %}

        <input type="password" name="old_password" class="form-control" placeholder="Old Password">

        <input type="password" name="new_password" class="form-control" placeholder="New Password">

        <button type="submit" class="btn-change">
            Update Password
        </button>

    </form>

</div>

{% endblock %}

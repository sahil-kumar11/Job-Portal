<!DOCTYPE html>
<html>
<head>

    {% load static %}

    <title>Job Portal</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-wrapper {
            flex: 1;
        }

        /* Smooth font */
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        /* NAV LINKS */
        .nav-link{
            color: white !important;
            margin-right: 10px;
            transition: 0.3s;
            border-radius: 8px;
            padding: 6px 12px;
        }

        .nav-link:hover{
            color: yellow !important;
            font-weight: bold;
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        /* BRAND */
        .navbar-brand:hover{
            color: yellow !important;
            transform: scale(1.05);
            transition: 0.3s;
        }

        /* SOCIAL ICONS */
        .social-icon i{
            font-size: 26px;
            margin-right: 10px;
            color: black;
            transition: 0.3s;
            cursor: pointer;
        }

        .social-icon i:hover{
            color: #ff4b2b;
            transform: scale(1.3) rotate(5deg);
        }

        /* HEADER SHADOW */
        .header-box{
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            padding: 10px 0;
            background: white;
        }

        /* NAVBAR SHADOW */
        .navbar{
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

    </style>

</head>

<body>

    <!-- HEADER -->
    <div class="container header-box mt-2 mb-2">

        <div class="row align-items-center">

            <div class="col-md-3 text-center">
                <img src="{% static 'images/job1.jpg' %}"
                style="width:160px; height:140px; border-radius:10px;">
            </div>

            <div class="col-md-6 text-center">

                <span style="font-weight:bold; font-size:34px;">

                    <span style="color:#ff4b2b;">Online Job</span>

                    <span style="color:#28a745;">Portal System</span>

                </span>

            </div>

            <div class="col-md-3 text-center social-icon">

                <i class="fa fa-twitter"></i>
                <i class="fa fa-facebook"></i>
                <i class="fa fa-linkedin"></i>
                <i class="fa fa-instagram"></i>

            </div>

        </div>

    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-sm navbar-dark"
    style="background: linear-gradient(to right, #8e0e00, #1f1c18);">

        <a class="navbar-brand font-weight-bold pl-4"
        style="font-family:'Monotype Corsiva'; font-size:30px;"
        href="#">

            Job Portal

        </a>

        <button class="navbar-toggler" type="button"
        data-toggle="collapse"
        data-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_home' %}">
                        <i class="fa fa-home mr-1"></i>Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'job_list' %}">
                        <i class="fa fa-briefcase mr-1"></i>Jobs List
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_change_password' %}">
                        <i class="fa fa-key mr-1"></i>Change Password
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_logout' %}">
                        <i class="fa fa-sign-out mr-1"></i>Logout
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- CONTENT WRAPPER -->
    <div class="content-wrapper">
        {% block body %}
        {% endblock %}
    </div>

    <!-- FOOTER -->
    {% include "footer.html" %}

</body>
</html>
